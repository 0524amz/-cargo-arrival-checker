<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>Cargo Arrival Checker</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--ok:#059669;--warn:#d97706;--bad:#dc2626;--dark:#111827}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:24px;margin:4px 0}.sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.title{font-weight:800;margin-bottom:6px}.hint{font-size:12px;color:var(--muted);line-height:1.5}
.status{font-size:13px;font-weight:700;margin-top:8px}.oktxt{color:var(--ok)}.warntxt{color:var(--warn)}.badtxt{color:var(--bad)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}
input,button,textarea{width:100%;font:inherit;border-radius:12px;border:1px solid var(--line);padding:12px;background:#fff;color:var(--text)}
button{font-weight:700;cursor:pointer}button.primary{background:var(--dark);color:#fff;border-color:var(--dark)}
button.danger{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.flight{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.flightHead{padding:12px 14px;background:#f9fafb;display:flex;justify-content:space-between;align-items:center;gap:10px}
.flightTitle{font-weight:800}.badge{font-size:12px;padding:6px 9px;border-radius:999px;font-weight:800;white-space:nowrap}
.badge.ok{background:#d1fae5;color:#065f46}.badge.warn{background:#fef3c7;color:#92400e}
.item{padding:12px 14px;border-top:1px solid var(--line)}.awb{font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:4px}
.qty{font-size:18px;font-weight:900;margin-top:8px}.qty.ok{color:var(--ok)}.qty.bad{color:var(--bad)}
.actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.actions button{flex:1;min-width:76px;padding:9px 6px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
textarea{min-height:110px;font-size:12px}
.sticky{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:10}
.sticky .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}.sticky button{flex:1}
@media(max-width:430px){.row{align-items:stretch}.row>*{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<h1>Cargo Arrival Checker</h1>
<div class="sub">CBA 자동 등록 · YP 표형식 인식 · 마스터 라벨 다중 등록 · 부족 PCS 계산 · 선입고 라벨 자동 매칭</div>

<div class="card">
<div class="title">1. CBA 자동 등록</div>
<div class="hint">PDF 또는 이미지 CBA를 고르면 즉시 분석합니다. 따로 등록 버튼은 없습니다.</div>
<label>CBA 파일</label>
<input id="cbaFile" type="file" accept="application/pdf,image/*,.pdf,.jpg,.jpeg,.png,.webp">
<div id="cbaInfo" class="hint" style="margin-top:8px">등록된 CBA 없음</div>
<div id="cbaStatus" class="status"></div>
<details style="margin-top:10px"><summary>인식 원문 보기</summary><textarea id="cbaText" readonly></textarea></details>
</div>

<div class="card">
<div class="title">2. 마스터 라벨 여러 장 등록</div>
<div class="hint">사진을 여러 장 한꺼번에 선택할 수 있습니다. CBA가 아직 없으면 AWB를 대기함에 저장하고, 나중에 CBA가 들어오면 자동 매칭합니다.</div>
<label>라벨 사진</label>
<input id="labelFiles" type="file" accept="image/*" multiple>
<div id="labelInfo" class="hint" style="margin-top:8px">선택된 라벨 없음</div>
<div id="labelStatus" class="status"></div>
<div id="batchResult" class="hint" style="white-space:pre-line;margin-top:8px"></div>
</div>

<div class="card">
<div class="title">3. CBA 대기 라벨</div>
<div id="pendingSummary" class="hint"></div>
<div id="pendingList"></div>
</div>

<div class="card">
<div class="row">
<div class="grow"><div class="title">입고 현황</div><div id="summary" class="hint"></div></div>
<button id="resetBtn" class="danger" style="width:auto">전체 초기화</button>
</div>
<div id="dashboard"></div>
</div>
</div>

<div class="sticky"><div class="inner">
<button onclick="document.getElementById('cbaFile').click()">CBA 선택</button>
<button class="primary" onclick="document.getElementById('labelFiles').click()">라벨 여러 장 선택</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const KEY='cargo-arrival-checker-v4';
let state=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"pending":[],"cba":null}');
state.items ||= []; state.pending ||= [];
const $=id=>document.getElementById(id);

function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function normAwb(v){return(v||'').toUpperCase().replace(/\s+/g,'').replace(/[^A-Z0-9-]/g,'')}
function bareAwb(v){return normAwb(v).replace(/-/g,'')}

/* YP CBA는 AWB가 350-3829 4922처럼 4+4로 띄어져 보이는 경우가 많다.
   기존 정규식은 이 중간 공백을 허용하지 않아 OCR이 성공해도 AWB를 버리고 있었다. */
function findAwbMatches(t){
  const out=[], seen=new Set();

  // 일반 표기: 350-3829 5261 / 350 3829 5261 / 35038295261
  const normal=/\b(\d{3})\s*[-–—]?\s*(\d{4})\s*(\d{4})(?!\d)/g;
  let m;
  while((m=normal.exec(t))!==null){
    const awb=m[1]+'-'+m[2]+m[3];
    if(!seen.has(awb)){
      seen.add(awb);
      out.push({awb,raw:m[0],index:m.index,end:m.index+m[0].length});
    }
  }

  // 바코드 숫자열: 3503829526100001처럼 AWB 11자리 뒤에 일련번호가 붙는 형식
  const longDigits=/\b(\d{11,18})\b/g;
  while((m=longDigits.exec(t))!==null){
    const digits=m[1];
    const first11=digits.slice(0,11);
    const awb=first11.slice(0,3)+'-'+first11.slice(3);
    if(!seen.has(awb)){
      seen.add(awb);
      out.push({awb,raw:m[0],index:m.index,end:m.index+11});
    }
  }
  return out
}
function findAwbs(t){return findAwbMatches(t).map(x=>x.awb)}

function findFlight(t){
  const m=t.toUpperCase().match(/\b([A-Z]{2}|[A-Z]\d|\d[A-Z])\s*[- ]?\s*(\d{2,4}[A-Z]?)\b/);
  return m?m[1]+m[2]:null
}
function findPcs(t){
  const u=t.toUpperCase();
  let m=u.match(/(?:PCS|PIECES?|PKG|PKGS)\s*[:\-]?\s*(\d{1,5})\b/);
  if(m)return Number(m[1]);
  m=u.match(/\b(\d{1,5})\s*(?:PCS|PIECES?|PKG|PKGS)\b/);
  return m?Number(m[1]):null
}
function pcsAfterAwb(line,match){
  // 표 한 줄이 "350-3829 5235 LAX 8"처럼 읽힌 경우 AWB 뒤 첫 숫자를 PCS로 사용.
  let tail=line.slice(match.end).toUpperCase();
  tail=tail.replace(/\b[A-Z]{3}\b/g,' '); // DEST 제거
  const nums=[...tail.matchAll(/\b(\d{1,4})\b/g)].map(x=>Number(x[1])).filter(n=>n>0 && n<5000);
  return nums.length?nums[0]:null
}
function parseCbaText(text,forcedFlight=''){
  const lines=text.split(/\r?\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean),map=new Map();
  let currentFlight=forcedFlight||'';
  lines.forEach((line,i)=>{
    const fl=findFlight(line); if(fl)currentFlight=fl;
    for(const match of findAwbMatches(line)){
      let pcs=pcsAfterAwb(line,match)||findPcs(line);
      if(!pcs){
        // OCR이 셀을 다음 줄로 끊은 경우 바로 다음 두 줄까지 확인.
        for(let j=i+1;j<=Math.min(i+2,lines.length-1);j++){
          if(findAwbMatches(lines[j]).length) break;
          const n=findPcs(lines[j]) || (/^\s*\d{1,4}\s*$/.test(lines[j]) ? Number(lines[j]) : null);
          if(n && n>0 && n<5000){pcs=n;break}
        }
      }
      pcs=pcs||1;
      const flight=forcedFlight||fl||currentFlight||findFlight((lines[i-1]||'')+' '+(lines[i+1]||''))||'UNKNOWN';
      const k=bareAwb(match.awb);
      if(!map.has(k)) map.set(k,{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),flight,awb:match.awb,planned:pcs,arrived:0,scanned:false});
      else if(pcs>map.get(k).planned) map.get(k).planned=pcs;
    }
  });
  return [...map.values()]
}

async function loadImageElement(file){
  return await new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이미지 로드 실패'))};
    img.src=url;
  })
}
async function cropOcr(file,x,y,w,h,scale=1.8){
  const img=await loadImageElement(file);
  const sx=Math.round(img.naturalWidth*x), sy=Math.round(img.naturalHeight*y);
  const sw=Math.round(img.naturalWidth*w), sh=Math.round(img.naturalHeight*h);
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(sw*scale));
  canvas.height=Math.max(1,Math.round(sh*scale));
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  return await imageText(canvas);
}
async function parseCbaImage(file){
  // YP CBA 샘플 기준: 상단에서 편명, 왼쪽 표 영역에서 M/AWB + DEST + PCS를 따로 읽는다.
  const headerText=await cropOcr(file,0,0,1,0.16,1.6);
  const flight=findFlight(headerText)||'UNKNOWN';
  const tableText=await cropOcr(file,0.055,0.115,0.37,0.79,2.0);
  let items=parseCbaText(tableText,flight);

  // 표 크롭에서 못 찾으면 전체 OCR을 한 번 더 시도.
  let fullText='';
  if(!items.length){
    fullText=await imageText(file);
    items=parseCbaText(fullText,flight);
  }
  return {items,raw:[headerText,'--- YP TABLE OCR ---',tableText,fullText].filter(Boolean).join('\n')}
}
async function pdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF 엔진 로드 실패');
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let all='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),content=await page.getTextContent(),rows={};
    content.items.forEach(it=>{const y=Math.round(it.transform[5]);(rows[y]||=[]).push({x:it.transform[4],s:it.str})});
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      rows[y].sort((a,b)=>a.x-b.x);
      all+=rows[y].map(o=>o.s).join(' ')+'\n'
    })
  }
  return all
}
async function imageText(file){
  if(!window.Tesseract) throw new Error('OCR 엔진 로드 실패');
  const r=await Tesseract.recognize(file,'eng');
  return r.data.text||''
}
function reconcilePending(){
  let hits=0; const keep=[];
  for(const p of state.pending){
    const item=state.items.find(x=>bareAwb(x.awb)===bareAwb(p.awb));
    if(!item){keep.push(p);continue}
    item.scanned=true;
    item.arrived=Math.max(item.arrived||0,p.qty==null?item.planned:p.qty);
    hits++
  }
  state.pending=keep;
  return hits
}
async function handleCba(){
  const f=$('cbaFile').files?.[0]; if(!f)return;
  $('cbaInfo').textContent='선택됨: '+f.name;
  $('cbaStatus').className='status';
  $('cbaStatus').textContent='CBA 표 분석 중...';
  try{
    let parsed=[],raw='';
    if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){
      raw=await pdfText(f);
      parsed=parseCbaText(raw);
    }else{
      const result=await parseCbaImage(f);
      parsed=result.items; raw=result.raw;
    }
    $('cbaText').value=raw;
    if(!parsed.length) throw new Error('AWB를 찾지 못했습니다');
    const old=new Map(state.items.map(x=>[bareAwb(x.awb),x]));
    state.items=parsed.map(x=>{
      const o=old.get(bareAwb(x.awb));
      return o?{...x,arrived:o.arrived||0,scanned:o.scanned||false}:x
    });
    state.cba={name:f.name,at:new Date().toISOString()};
    const matched=reconcilePending();
    save();
    $('cbaStatus').className='status oktxt';
    $('cbaStatus').textContent=`자동 등록 ${state.items.length} AWB · 기존 대기 라벨 ${matched}건 매칭`;
  }catch(e){
    $('cbaStatus').className='status badtxt';
    $('cbaStatus').textContent='CBA 분석 실패 · '+(e?.message||'파일 확인 필요')
  }
}

function digitsOnly(v){return String(v||'').replace(/\D/g,'')}
function hammingLike(a,b){
  if(a.length!==b.length) return 99;
  let d=0;
  for(let i=0;i<a.length;i++) if(a[i]!==b[i]) d++;
  return d;
}
function bestKnownAwbFromText(text){
  const exact=findAwbs(text)[0];
  if(exact) return exact;

  // OCR이 구분자나 한 글자를 망가뜨렸을 때 CBA의 등록 AWB와 가장 가까운 11자리 숫자열 비교
  const runs=[...text.matchAll(/\d[\d\s\-–—]{9,20}\d/g)]
    .map(m=>digitsOnly(m[0]))
    .filter(s=>s.length>=10);

  let best=null, bestDist=99;
  for(const item of state.items){
    const target=digitsOnly(item.awb);
    for(const run of runs){
      for(let i=0;i<=Math.max(0,run.length-11);i++){
        const part=run.slice(i,i+11);
        if(part.length!==11) continue;
        const d=hammingLike(part,target);
        if(d<bestDist){bestDist=d;best=item.awb}
      }
    }
  }
  return bestDist<=1 ? best : '';
}

async function handleLabels(){
  const files=[...($('labelFiles').files||[])]; if(!files.length)return;
  $('labelInfo').textContent=`선택된 라벨 ${files.length}장`;

  let matched=0,pending=0,failed=0; const lines=[];

  for(let i=0;i<files.length;i++){
    $('labelStatus').className='status';
    $('labelStatus').textContent=`라벨 분석 중 ${i+1}/${files.length}`;

    try{
      const text=await imageText(files[i]);
      const awb=bestKnownAwbFromText(text);
      const pcs=findPcs(text);

      if(!awb){
        failed++;
        lines.push(`${i+1}. AWB 인식 실패`);
        continue;
      }

      const item=state.items.find(x=>bareAwb(x.awb)===bareAwb(awb));

      if(item){
        item.scanned=true;

        // PCS가 실제로 라벨에서 읽힌 경우에만 수량 반영.
        // PCS가 없는 라벨은 AWB 입고 확인만 하고 수량은 건드리지 않는다.
        if(pcs!=null){
          item.arrived=Math.max(item.arrived||0,pcs);
          lines.push(`${i+1}. ${item.awb} → 매칭 · ${pcs} PCS`);
        }else{
          lines.push(`${i+1}. ${item.awb} → 매칭`);
        }

        matched++;
      }else{
        const ex=state.pending.find(x=>bareAwb(x.awb)===bareAwb(awb));

        if(ex){
          if(pcs!=null) ex.qty=Math.max(ex.qty||0,pcs);
        }else{
          state.pending.push({
            id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),
            awb,
            qty:pcs==null?null:pcs,
            at:new Date().toISOString()
          });
        }

        pending++;
        lines.push(`${i+1}. ${awb} → CBA 대기함 저장${pcs!=null?` · ${pcs} PCS`:''}`);
      }
    }catch(e){
      failed++;
      lines.push(`${i+1}. OCR 실패`);
    }
  }

  save();
  $('labelStatus').className='status '+(failed?'warntxt':'oktxt');
  $('labelStatus').textContent=`완료 · 즉시매칭 ${matched} / 대기저장 ${pending} / 실패 ${failed}`;
  $('batchResult').textContent=lines.join('\n')
}
function setQty(id){
  const i=state.items.find(x=>x.id===id); if(!i)return;
  const v=prompt('실제 도착수량',i.arrived||0); if(v===null)return;
  const n=Number(v); if(Number.isNaN(n)||n<0)return alert('0 이상의 숫자를 입력하세요.');
  i.arrived=n;i.scanned=true;save()
}
function addQty(id,n){
  const i=state.items.find(x=>x.id===id); if(!i)return;
  i.arrived=Math.max(0,(i.arrived||0)+n); i.scanned=true; save()
}
function removePending(id){state.pending=state.pending.filter(x=>x.id!==id);save()}
function render(){
  $('cbaInfo').textContent=state.cba?`등록됨: ${state.cba.name} · ${state.items.length} AWB`:'등록된 CBA 없음';
  $('pendingSummary').textContent=state.pending.length?`${state.pending.length}건이 CBA를 기다리는 중`:'대기 중인 라벨 없음';
  $('pendingList').innerHTML=state.pending.map(p=>`<div class="item"><div class="awb">${p.awb}</div><div class="meta">임시 수량 ${p.qty==null?'미확인':p.qty+' PCS'}</div><div class="actions"><button class="danger" onclick="removePending('${p.id}')">삭제</button></div></div>`).join('');
  if(!state.items.length){
    $('dashboard').innerHTML='<div class="empty">CBA가 없어도 라벨을 먼저 올릴 수 있습니다.</div>';
    $('summary').textContent=state.pending.length?`CBA 대기 라벨 ${state.pending.length}건`:'CBA 또는 라벨을 등록하세요.';
    return
  }
  const groups={}; state.items.forEach(i=>(groups[i.flight]||=[]).push(i));
  const done=state.items.filter(i=>i.scanned&&(i.arrived||0)>=i.planned).length;
  const qtyKnown=state.items.filter(i=>(i.arrived||0)>0);
  const missing=qtyKnown.reduce((s,i)=>s+Math.max(0,i.planned-(i.arrived||0)),0);
  const matchedOnly=state.items.filter(i=>i.scanned&&(i.arrived||0)===0).length;
  $('summary').textContent=`AWB ${done}/${state.items.length} 완료 · 수량미확인 ${matchedOnly} · 확인된 부족 ${missing} PCS`;
  $('dashboard').innerHTML=Object.entries(groups).map(([flight,items])=>{
    const complete=items.every(i=>i.scanned&&(i.arrived||0)>=i.planned);
    const miss=items.reduce((s,i)=>s+Math.max(0,i.planned-(i.arrived||0)),0);
    return `<div class="flight"><div class="flightHead"><div><div class="flightTitle">${flight}</div><div class="meta">${items.length} AWB</div></div><div class="badge ${complete?'ok':'warn'}">${complete?'✅ COMPLETE':'⚠ '+miss+' PCS 부족'}</div></div>${items.map(i=>{
      const arr=i.arrived||0,m=Math.max(0,i.planned-arr),d=i.scanned&&arr>=i.planned;
      const qtyText = i.scanned && arr===0
        ? `라벨 확인 · 예정 ${i.planned} PCS · 수량은 스킵`
        : `${arr}/${i.planned} · ${d?'완료':m+' PCS 부족'}`;
      return `<div class="item"><div class="awb">${i.awb}</div><div class="meta">${i.scanned?'라벨 확인됨':'미확인'} · 예정 ${i.planned} PCS</div><div class="qty ${d?'ok':(i.scanned&&arr===0?'':'bad')}">${qtyText}</div><div class="actions"><button onclick="addQty('${i.id}',1)">+1</button><button onclick="addQty('${i.id}',5)">+5</button><button onclick="setQty('${i.id}')">수량 수정</button></div></div>`
    }).join('')}</div>`
  }).join('')
}
window.setQty=setQty;window.addQty=addQty;window.removePending=removePending;
$('cbaFile').addEventListener('change',handleCba);
$('labelFiles').addEventListener('change',handleLabels);
$('resetBtn').addEventListener('click',()=>{
  if(confirm('모든 데이터를 초기화할까요?')){
    state={items:[],pending:[],cba:null};
    localStorage.removeItem(KEY);
    $('cbaText').value='';$('cbaStatus').textContent='';$('labelStatus').textContent='';$('batchResult').textContent='';
    save()
  }
});
render();
</script>
</body>
</html>
